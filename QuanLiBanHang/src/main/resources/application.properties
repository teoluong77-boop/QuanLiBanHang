spring.application.name=QuanLiBanHang
server.port=8080

# Đảm bảo request/response dùng UTF-8 (hiển thị tiếng Việt chính xác)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- Cấu hình kết nối MySQL Database ---
spring.datasource.url=jdbc:mysql://localhost:3306/quanlibanhang?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Cấu hình JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Cấu hình đường dẫn Swagger UI ---
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# 🌟 CẤU HÌNH HIỂN THỊ CẢ CÁC CLASS @Controller TRUYỀN THỐNG
springdoc.packages-to-scan=com.example.productapp.controller
spring.application.name=QuanLiBanHang
server.port=8080

# Đảm bảo request/response dùng UTF-8 (hiển thị tiếng Việt chính xác)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- Cấu hình kết nối MySQL Database ---
# Đổi quanlibanhang, root, 123456 theo đúng Tên DB, User, Pass MySQL trên máy bạn
spring.datasource.url=jdbc:mysql://localhost:3306/quanlibanhang?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Cấu hình JPA / Hibernate ---
# update: Tự động tạo/cập nhật bảng trong DB khi chạy app mà không làm mất dữ liệu cũ
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
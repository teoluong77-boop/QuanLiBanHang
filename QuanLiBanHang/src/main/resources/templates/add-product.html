<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Thêm sản phẩm</h1>

    <!-- Bắt buộc phải có enctype="multipart/form-data" để gửi file ảnh -->
    <form th:action="@{/products/add}" th:object="${product}" method="post" enctype="multipart/form-data">

        <div class="form-group">
            <label for="name">Tên sản phẩm:</label>
            <input type="text" id="name" th:field="*{name}">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group">
            <label for="price">Giá:</label>
            <input type="number" id="price" step="any" th:field="*{price}">
            <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
        </div>

        <div class="form-group">
            <label for="quantity">Số lượng:</label>
            <input type="number" id="quantity" th:field="*{quantity}">
        </div>

        <!-- Ô CHỌN FILE ẢNH -->
        <div class="form-group">
            <label for="imageFile">Hình ảnh sản phẩm:</label>
            <input type="file" id="imageFile" name="imageFile" accept="image/*">
        </div>

        <!-- Ô CHỌN DANH MỤC -->
        <div class="form-group" th:if="${categories != null}">
            <label for="category">Danh mục:</label>
            <select id="category" th:field="*{category}">
                <option value="">-- Chọn danh mục --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>

        <div class="form-actions" style="margin-top: 15px;">
            <button class="btn" type="submit">Lưu</button>
            <a class="btn btn-secondary" th:href="@{/products}">Quay lại</a>
        </div>
    </form>
</div>
</body>
</html>

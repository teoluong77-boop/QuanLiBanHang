<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSMS Market - Thêm sản phẩm</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #d1d5db; /* Tông xám bo tròn chuẩn CSMS */
            color: #111827;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-card {
            background: #e5e7eb;
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .form-title {
            font-size: 32px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.5px;
        }

        .btn-back {
            text-decoration: none;
            color: #4b5563;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 14px;
            background: #d1d5db;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: #9ca3af;
            color: #111827;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #374151;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            background-color: #f9fafb;
            font-size: 14px;
            outline: none;
            color: #111827;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus {
            border-color: #111827;
            background-color: #ffffff;
        }

        /* 🌟 THẺ HIỂN THỊ VÍ ADMIN */
        .wallet-card {
            background-color: #dcfce7;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 🌟 Ô TÍNH TỔNG TIỀN VỐN SẼ TRỪ */
        .calc-box {
            background-color: #fef3c7;
            border: 1px solid #fde68a;
            color: #92400e;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .error-box {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            background-color: #111827;
            color: white;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1f2937;
        }
    </style>
</head>
<body>

<div class="form-card">
    <div class="header-area">
        <h2 class="form-title">Thêm sản phẩm mới</h2>
        <a th:href="@{/products}" class="btn-back">← Quay lại</a>
    </div>

    <!-- KHỐI THÔNG BÁO LỖI NẾU KHÔNG ĐỦ TIỀN -->
    <div th:if="${errorMessage}" class="error-box">
        ⚠️ <span th:text="${errorMessage}">Số dư Ví Admin không đủ để nhập hàng!</span>
    </div>

    <!-- 💳 THẺ HIỂN THỊ SỐ DƯ VÍ ADMIN HIỆN CÓ -->
    <div class="wallet-card">
        <span>💳 Số dư Ví Admin hiện có:</span>
        <span style="color: #15803d; font-size: 16px;"
              th:text="${adminBalance != null ? #numbers.formatDecimal(adminBalance, 1, 'POINT', 0, 'COMMA') + ' ₫' : '0 ₫'}">
            0 ₫
        </span>
    </div>

    <form th:action="@{/products/add}" method="post" th:object="${product}" enctype="multipart/form-data">
        <div class="form-group">
            <label>Tên sản phẩm (*)</label>
            <input type="text" th:field="*{name}" class="form-input" placeholder="Nhập tên sản phẩm..." required>
        </div>

        <div class="form-group">
            <label>Danh mục (*)</label>
            <select th:field="*{category.id}" class="form-select" required>
                <option value="">-- Chọn danh mục --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>

        <!-- 🌟 ĐÃ ĐỔI step="any" ĐỂ TRÁNH LỖI BẮT BƯỚC NHẢY SỐ -->
        <div class="form-group">
            <label style="color: #dc2626;">Giá nhập vốn (VNĐ) (*)</label>
            <input type="number" id="importPrice" th:field="*{importPrice}" class="form-input" placeholder="Ví dụ: 100000" step="any" min="1" required>
        </div>

        <!-- GIÁ BÁN CHO KHÁCH -->
        <div class="form-group">
            <label style="color: #16a34a;">Giá bán cho khách (VNĐ) (*)</label>
            <input type="number" th:field="*{price}" class="form-input" placeholder="Ví dụ: 200000" step="any" min="1" required>
        </div>

        <!-- SỐ LƯỢNG KHO -->
        <div class="form-group">
            <label>Số lượng kho (*)</label>
            <input type="number" id="quantity" th:field="*{quantity}" class="form-input" placeholder="Ví dụ: 10" min="0" required>
        </div>

        <!-- 💸 KHỐI HIỂN THỊ TỔNG TIỀN VỐN SẼ TRỪ VÍ ADMIN -->
        <div class="calc-box">
            <span>💸 Tiền vốn trừ Ví Admin:</span>
            <span id="totalImportCost" style="color: #dc2626; font-size: 16px;">0 ₫</span>
        </div>

        <div class="form-group">
            <label>Đánh giá</label>
            <input type="text" th:field="*{rating}" class="form-input" placeholder="Ví dụ: 4.8 / 5 ⭐">
        </div>

        <div class="form-group">
            <label>Nhãn sản phẩm</label>
            <input type="text" th:field="*{tag}" class="form-input" placeholder="Ví dụ: Bán chạy, Giảm giá, Nổi bật">
        </div>

        <div class="form-group">
            <label>Hình ảnh sản phẩm</label>
            <input type="file" name="imageFile" class="form-input" accept="image/*">
        </div>

        <button type="submit" class="btn-submit">Thêm sản phẩm</button>
    </form>
</div>

<!-- SCRIPT TỰ ĐỘNG TÍNH TỔNG VỐN NHẬP -->
<script>
    const importPriceInput = document.getElementById('importPrice');
    const quantityInput = document.getElementById('quantity');
    const totalCostSpan = document.getElementById('totalImportCost');

    function calculateTotalCost() {
        if (!totalCostSpan) return;
        const price = parseFloat(importPriceInput.value) || 0;
        const qty = parseInt(quantityInput.value) || 0;
        const total = price * qty;
        totalCostSpan.textContent = total.toLocaleString('vi-VN') + ' ₫';
    }

    if (importPriceInput && quantityInput) {
        importPriceInput.addEventListener('input', calculateTotalCost);
        quantityInput.addEventListener('input', calculateTotalCost);
    }
</script>

</body>
</html>

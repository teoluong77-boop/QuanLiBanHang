<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSMS Market - Thêm sản phẩm</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #d1d5db; /* Tông xám bo tròn chuẩn CSMS */
            color: #111827;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-card {
            background: #e5e7eb;
            border-radius: 28px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .form-title {
            font-size: 32px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.5px;
        }

        .btn-back {
            text-decoration: none;
            color: #4b5563;
            font-size: 14px;
            font-weight: 600;
            padding: 8px 14px;
            background: #d1d5db;
            border-radius: 10px;
            transition: all 0.2s;
        }

        .btn-back:hover {
            background: #9ca3af;
            color: #111827;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #374151;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            background-color: #f9fafb;
            font-size: 14px;
            outline: none;
            color: #111827;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus {
            border-color: #111827;
            background-color: #ffffff;
        }

        .btn-submit {
            width: 100%;
            background-color: #111827;
            color: white;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #1f2937;
        }
    </style>
</head>
<body>

<div class="form-card">
    <div class="header-area">
        <h2 class="form-title">Thêm sản phẩm mới</h2>
        <a th:href="@{/products}" class="btn-back">← Quay lại</a>
    </div>

    <form th:action="@{/products/add}" method="post" th:object="${product}" enctype="multipart/form-data">
        <div class="form-group">
            <label>Tên sản phẩm</label>
            <input type="text" th:field="*{name}" class="form-input" placeholder="Nhập tên sản phẩm..." required>
        </div>

        <div class="form-group">
            <label>Danh mục</label>
            <select th:field="*{category.id}" class="form-select" required>
                <option value="">-- Chọn danh mục --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Giá bán</label>
            <input type="number" th:field="*{price}" class="form-input" placeholder="Nhập giá bán..." required>
        </div>

        <div class="form-group">
            <label>Số lượng kho</label>
            <input type="number" th:field="*{quantity}" class="form-input" placeholder="Nhập số lượng kho..." required>
        </div>

        <div class="form-group">
            <label>Đánh giá</label>
            <input type="text" name="rating" class="form-input" placeholder="Ví dụ: 4.8 / 5 ⭐">
        </div>

        <div class="form-group">
            <label>Nhãn sản phẩm</label>
            <input type="text" name="tag" class="form-input" placeholder="Ví dụ: Bán chạy, Giảm giá, Nổi bật">
        </div>

        <div class="form-group">
            <label>Hình ảnh sản phẩm</label>
            <input type="file" name="imageFile" class="form-input" accept="image/*">
        </div>

        <button type="submit" class="btn-submit">Thêm sản phẩm</button>
    </form>
</div>

</body>
</html>

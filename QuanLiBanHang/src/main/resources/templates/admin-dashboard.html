<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSMS - Hệ thống Quản lý Bán hàng Siêu thị</title>
    <!-- Tích hợp Chart.js để vẽ biểu đồ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #d1d5db;
            color: #111827;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Top Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #111827;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #4b5563;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #111827;
            font-weight: 700;
        }

        .btn-logout {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-logout:hover {
            background-color: #b91c1c;
        }

        /* Banner Card */
        .banner-card {
            background: #e5e7eb;
            border-radius: 28px;
            padding: 40px 45px;
            margin-bottom: 20px;
        }

        .sub-header {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #6b7280;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .main-title {
            font-size: 42px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        .sub-description {
            color: #4b5563;
            font-size: 15px;
        }

        /* Stats Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #e5e7eb;
            border-radius: 20px;
            padding: 22px;
            text-align: center;
        }

        .stat-label {
            font-size: 14px;
            color: #4b5563;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .stat-number {
            font-size: 26px;
            font-weight: 800;
            color: #111827;
        }

        /* Main Content Layout */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .section-card {
            background: #e5e7eb;
            border-radius: 28px;
            padding: 35px;
        }

        .section-title {
            font-size: 26px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* Product Item Row Styling */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .product-info h4 {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 4px;
        }

        .product-info p {
            font-size: 13px;
            color: #6b7280;
        }

        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #111827;
            white-space: nowrap;
        }

        .chart-container {
            position: relative;
            width: 100%;
            height: 280px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Navbar cho Admin -->
    <div class="navbar">
        <div class="logo">Super Market</div>
        <div class="nav-links">
            <a th:href="@{/admin}" class="active">Quản trị</a>
            <a th:href="@{/products}">Sản phẩm</a>

            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn-logout">Đăng xuất</button>
            </form>
        </div>
    </div>

    <!-- Banner section -->
    <div class="banner-card">
        <div class="sub-header">Quản Lý </div>
        <h1 class="main-title">Quản lý Bán Hàng </h1>
        <p class="sub-description">Hệ thống quản lý bán hàng siêu thị </p>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Sản phẩm</div>
            <div class="stat-number" th:text="${productCount != null ? productCount : (products != null ? products.size() : 0)}">3</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Đơn hàng</div>
            <div class="stat-number" th:text="${orderCount != null ? orderCount : 2}">2</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Doanh thu</div>
            <div class="stat-number" th:text="|${#numbers.formatInteger(totalRevenue != null ? totalRevenue : 2130000, 1, 'POINT')} ₫|">2.130.000 ₫</div>
        </div>
    </div>

    <!-- Work Area -->
    <div class="content-grid">
        <!-- Khối bên trái: Biểu đồ Sản phẩm Bán chạy -->
        <div class="section-card">
            <h2 class="section-title">📊 Top Sản Phẩm Bán Chạy</h2>
            <div class="chart-container">
                <canvas id="topProductsChart"></canvas>
            </div>
        </div>

        <!-- Khối bên phải: Danh sách sản phẩm -->
        <div class="section-card">
            <h2 class="section-title">Danh sách sản phẩm</h2>
            <div class="product-list">
                <div class="product-item" th:each="product : ${products}">
                    <div class="product-info">
                        <h4 th:text="${product.name}">camera</h4>
                        <p th:text="${product.category != null ? product.category.name : 'Chưa phân loại'}">Phụ kiện</p>
                    </div>
                    <div class="product-price" th:text="|${#numbers.formatInteger(product.price, 1, 'POINT')} ₫|">1.500.000 ₫</div>
                </div>

                <p th:if="${#lists.isEmpty(products)}" style="color: #6b7280; text-align: center; margin-top: 20px;">
                    Chưa có sản phẩm nào.
                </p>
            </div>
        </div>
    </div>
</div>

<!-- Script vẽ biểu đồ với DỮ LIỆU THẬT từ Database -->
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const ctx = document.getElementById('topProductsChart').getContext('2d');

        // Lấy danh sách tên sản phẩm và số lượng từ Controller truyền sang
        const productNames = /*[[${chartNames}]]*/ ['visung', 'camera', 'isung'];
        const productQuantities = /*[[${chartQuantities}]]*/ [120, 85, 45];

        // Mảng màu sắc tự động cho các cột
        const colors = ['#111827', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#6366f1'];

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: productNames,
                datasets: [{
                    label: 'Số lượng kho / Đã bán',
                    data: productQuantities,
                    backgroundColor: colors.slice(0, productNames.length),
                    borderRadius: 8,
                    barThickness: 32
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: '#d1d5db'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
    });
</script>

</body>
</html>

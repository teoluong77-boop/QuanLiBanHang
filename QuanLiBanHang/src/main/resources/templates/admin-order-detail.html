<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chi tiết đơn hàng - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 th:text="|Chi tiết đơn hàng #${order.id}|">Chi tiết đơn hàng #1</h1>
        <div>
            <a class="btn" style="background-color: #0275d8; color: white; text-decoration: none; margin-right: 10px;"
               th:href="@{/orders/{id}/invoice(id=${order.id})}" target="_blank">🖨️ In Hóa Đơn / PDF</a>
            <a class="btn btn-secondary" th:href="@{/admin/orders}">Quay lại danh sách đơn</a>
        </div>
    </div>

    <!-- Thông tin người đặt hàng -->
    <div style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <p><strong>Khách hàng:</strong>
            <span th:text="${order.customerName != null ? order.customerName : (order.customer != null ? order.customer.name : 'Khách vãng lai')}"></span>
        </p>
        <p><strong>Số điện thoại:</strong>
            <span th:text="${order.phoneNumber != null ? order.phoneNumber : (order.customer != null ? order.customer.phoneNumber : '-')}"></span>
        </p>
        <p><strong>Địa chỉ giao hàng:</strong>
            <span th:text="${order.address != null ? order.address : (order.customer != null ? order.customer.address : '-')}"></span>
        </p>
        <p th:if="${order.note != null and !order.note.isBlank()}">
            <strong>Ghi chú:</strong> <span th:text="${order.note}"></span>
        </p>
        <p><strong>Thời gian đặt:</strong>
            <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm:ss')}"></span>
        </p>
    </div>

    <h3>Sản phẩm trong đơn hàng</h3>
    <table>
        <thead>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Đơn giá</th>
            <th>Số lượng mua</th>
            <th>Thành tiền</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="detail : ${order.orderDetails}">
            <td th:text="${detail.product != null ? detail.product.name : 'Sản phẩm đã xóa'}">Tên SP</td>

            <!-- Format đơn giá bằng formatDecimal -->
            <td class="price"
                th:text="${detail.price != null ? #numbers.formatDecimal(detail.price, 1, 'POINT', 0, 'COMMA') + ' ₫' : '0 ₫'}">0 ₫</td>

            <td style="text-align: center;" th:text="${detail.quantity}">1</td>

            <!-- Sử dụng field subtotal có sẵn hoặc hiển thị an toàn -->
            <td class="price"
                th:text="${detail.subtotal != null ? #numbers.formatDecimal(detail.subtotal, 1, 'POINT', 0, 'COMMA') + ' ₫' : (detail.price != null ? #numbers.formatDecimal(detail.price, 1, 'POINT', 0, 'COMMA') + ' ₫' : '0 ₫')}">0 ₫</td>
        </tr>
        </tbody>
    </table>

    <div style="text-align: right; margin-top: 20px;">
        <h2 style="color: #d9534f;">Tổng đơn:
            <span th:text="${order.totalAmount != null ? #numbers.formatDecimal(order.totalAmount, 1, 'POINT', 0, 'COMMA') + ' ₫' : '0 ₫'}">0 ₫</span>
        </h2>
    </div>
</div>
</body>
</html>

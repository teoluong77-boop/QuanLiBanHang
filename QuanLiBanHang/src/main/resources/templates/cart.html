<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giỏ hàng của bạn</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">

    <!-- Header Tiêu đề & Nút Quay lại -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="margin: 0;">🛒 Giỏ hàng của bạn</h1>
        <a class="btn btn-secondary" th:href="@{/products}">Quay lại danh sách</a>
    </div>

    <!-- BẢNG DANH SÁCH MÓN HÀNG TRONG GIỎ (Nếu giỏ không trống) -->
    <table th:if="${not #lists.isEmpty(cartItems)}">
        <thead>
        <tr>
            <th>Hình ảnh</th>
            <th>Tên sản phẩm</th>
            <th>Đơn giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cartItems}">
            <!-- Hình ảnh sản phẩm -->
            <td style="text-align: center;">
                <img th:if="${item.product.imageUrl != null}"
                     th:src="${item.product.imageUrl}"
                     alt="Ảnh sản phẩm"
                     style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px;">
                <span th:if="${item.product.imageUrl == null}" class="muted">Chưa có ảnh</span>
            </td>

            <!-- Tên sản phẩm -->
            <td th:text="${item.product.name}">Tên sản phẩm</td>

            <!-- Đơn giá -->
            <td class="price"
                th:text="|${#numbers.formatInteger(item.product.price, 1, 'POINT')} ₫|">0 ₫</td>

            <!-- Thay đổi số lượng -->
            <td style="text-align: center;">
                <form th:action="@{/cart/update/{id}(id=${item.product.id})}" method="post" style="display: inline-flex; gap: 5px; align-items: center; justify-content: center; margin: 0;">
                    <input type="number" name="quantity" th:value="${item.quantity}" min="1" style="width: 60px; padding: 4px; text-align: center;">
                    <button class="btn btn-secondary" type="submit" style="padding: 4px 8px;">Cập nhật</button>
                </form>
            </td>

            <!-- Thành tiền -->
            <td class="price"
                th:text="|${#numbers.formatInteger(item.getTotalPrice(), 1, 'POINT')} ₫|">0 ₫</td>

            <!-- Xóa món khỏi giỏ -->
            <td class="actions" style="text-align: center;">
                <form th:action="@{/cart/remove/{id}(id=${item.product.id})}" method="post" style="margin: 0;">
                    <button class="btn btn-danger" type="submit">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Khối Tổng tiền và Nút Thanh toán -->
    <div th:if="${not #lists.isEmpty(cartItems)}" style="margin-top: 25px; text-align: right;">
        <h2 style="color: #d9534f; margin-bottom: 15px;">
            Tổng thanh toán:
            <span th:text="|${#numbers.formatInteger(totalAmount, 1, 'POINT')} ₫|">0 ₫</span>
        </h2>
        <a class="btn" style="padding: 12px 24px; font-size: 16px; background-color: #5cb85c; text-decoration: none;" th:href="@{/checkout}">
            Tiến hành Thanh Toán ➔
        </a>
    </div>

    <!-- Thông báo khi Giỏ hàng trống -->
    <div th:if="${#lists.isEmpty(cartItems)}" style="text-align: center; margin: 50px 0;">
        <p class="muted" style="font-size: 18px; margin-bottom: 20px;">Giỏ hàng của bạn đang trống!</p>
        <a class="btn" th:href="@{/products}">Tiếp tục mua sắm</a>
    </div>

</div>
</body>
</html>

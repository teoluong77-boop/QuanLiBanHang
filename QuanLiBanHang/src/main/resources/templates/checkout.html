<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thanh toán đơn hàng</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>📝 Thông tin giao hàng</h1>
        <a class="btn btn-secondary" th:href="@{/cart}">Quay lại giỏ hàng</a>
    </div>

    <!-- Hiển thị thông báo lỗi nếu không đủ tiền trong ví -->
    <div th:if="${errorMessage}" style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-weight: bold;">
        ⚠️ <span th:text="${errorMessage}">Số dư không đủ</span>
    </div>

    <form th:action="@{/checkout}" method="post">
        <div style="margin-bottom: 15px;">
            <label for="customerName" style="display: block; font-weight: bold; margin-bottom: 5px;">Họ và tên người nhận (*):</label>
            <input type="text" id="customerName" name="customerName" th:value="${customer != null ? customer.name : ''}" required placeholder="Nguyễn Văn A"
                   style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="phoneNumber" style="display: block; font-weight: bold; margin-bottom: 5px;">Số điện thoại (*):</label>
            <input type="text" id="phoneNumber" name="phoneNumber" th:value="${customer != null ? customer.phoneNumber : ''}" required placeholder="0901234567"
                   style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="address" style="display: block; font-weight: bold; margin-bottom: 5px;">Địa chỉ nhận hàng (*):</label>
            <input type="text" id="address" name="address" th:value="${customer != null ? customer.address : ''}" required placeholder="Số 123, đường ABC, Quận 1..."
                   style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="note" style="display: block; font-weight: bold; margin-bottom: 5px;">Ghi chú (nếu có):</label>
            <input type="text" id="note" name="note" placeholder="Giao giờ hành chính..."
                   style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <!-- 🌟 PHƯƠNG THỨC THANH TOÁN -->
        <div style="margin-bottom: 20px; border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; background: #fafafa;">
            <h3 style="margin-top: 0; color: #1e293b;">💳 Chọn phương thức thanh toán</h3>

            <!-- Lựa chọn 1: Tiền mặt COD -->
            <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
                <input type="radio" id="cod" name="paymentMethod" value="COD" checked style="width: 18px; height: 18px;">
                <label for="cod" style="font-weight: 500; cursor: pointer;">💵 Thanh toán khi nhận hàng (COD)</label>
            </div>

            <!-- Lựa chọn 2: Trừ tiền Ví cá nhân -->
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="radio" id="wallet" name="paymentMethod" value="WALLET" th:disabled="${customer == null}" style="width: 18px; height: 18px;">
                <label for="wallet" style="font-weight: 500; cursor: pointer;">
                    💳 Thanh toán bằng Ví cá nhân
                    <span th:if="${customer != null}" style="color: #16a34a; font-weight: bold;"
                          th:text="| (Số dư ví: ${#numbers.formatDecimal(customer.balance, 1, 'POINT', 0, 'COMMA')} ₫)|"></span>
                    <span th:if="${customer == null}" style="color: #dc2626; font-style: italic;"> (Yêu cầu đăng nhập để sử dụng)</span>
                </label>
            </div>
        </div>

        <div style="margin: 20px 0; padding: 15px; background: #f9f9f9; border-radius: 6px; text-align: right;">
            <h3 style="margin: 0; color: #d9534f;">Tổng tiền thanh toán:
                <span class="price" th:text="|${#numbers.formatDecimal(totalAmount, 1, 'POINT', 0, 'COMMA')} ₫|">0 ₫</span>
            </h3>
        </div>

        <div style="text-align: right;">
            <button class="btn" type="submit" style="background-color: #5cb85c; padding: 10px 20px; font-size: 16px;">
                Xác nhận đặt hàng ➔
            </button>
        </div>
    </form>
</div>
</body>
</html>

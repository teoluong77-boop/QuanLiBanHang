<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sửa sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Sửa sản phẩm</h1>

    <form th:action="@{/products/edit/{id}(id=${product.id})}" th:object="${product}" method="post" enctype="multipart/form-data">

        <div class="form-group">
            <label for="name">Tên sản phẩm:</label>
            <input type="text" id="name" th:field="*{name}">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group">
            <label for="price">Giá:</label>
            <input type="number" id="price" step="any" th:field="*{price}">
            <span class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
        </div>

        <div class="form-group">
            <label for="quantity">Số lượng:</label>
            <input type="number" id="quantity" th:field="*{quantity}">
        </div>

        <!-- ẢNH HIỆN TẠI & CHỌN ẢNH MỚI -->
        <div class="form-group">
            <label>Ảnh hiện tại:</label>
            <div style="margin-bottom: 8px;">
                <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" width="80" height="80" style="object-fit: cover; border-radius: 6px;">
                <span th:if="${product.imageUrl == null}" class="muted">Chưa có ảnh</span>
            </div>
            <label for="imageFile">Thay đổi ảnh mới (để trống nếu giữ ảnh cũ):</label>
            <input type="file" id="imageFile" name="imageFile" accept="image/*">
        </div>

        <!-- DANH MỤC -->
        <div class="form-group" th:if="${categories != null}">
            <label for="category">Danh mục:</label>
            <select id="category" th:field="*{category}">
                <option value="">-- Chọn danh mục --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>

        <div class="form-actions" style="margin-top: 15px;">
            <button class="btn" type="submit">Cập nhật</button>
            <a class="btn btn-secondary" th:href="@{/products}">Hủy</a>
        </div>
    </form>
</div>
</body>
</html>

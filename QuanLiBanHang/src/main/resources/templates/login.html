<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Quản lý Bán hàng</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px; border-radius: 12px; border: none;">
    <h3 class="text-center mb-4 text-primary fw-bold">ĐĂNG NHẬP</h3>

    <!-- Báo lỗi khi sai username / password -->
    <div th:if="${param.error}" class="alert alert-danger py-2 fs-6" role="alert">
        Tài khoản hoặc mật khẩu không chính xác!
    </div>

    <!-- Báo tin nhắn sau khi bấm Đăng xuất -->
    <div th:if="${param.logout}" class="alert alert-info py-2 fs-6" role="alert">
        Bạn đã đăng xuất thành công.
    </div>

    <!-- Báo tin nhắn sau khi Đăng ký tài khoản thành công -->
    <div th:if="${param.registered}" class="alert alert-success py-2 fs-6" role="alert">
        Đăng ký tài khoản thành công! Vui lòng đăng nhập.
    </div>

    <form th:action="@{/login}" method="post">
        <!-- CSRF Token (Spring Security tự động hỗ trợ nếu cần) -->

        <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Tài khoản</label>
            <input type="text"
                   id="username"
                   name="username"
                   class="form-control"
                   placeholder="Nhập tên tài khoản..."
                   required
                   autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Mật khẩu</label>
            <input type="password"
                   id="password"
                   name="password"
                   class="form-control"
                   placeholder="Nhập mật khẩu..."
                   required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-semibold" style="border-radius: 8px;">
            Đăng Nhập
        </button>
    </form>

    <hr class="my-4">

    <div class="text-center">
        <span class="text-muted">Chưa có tài khoản?</span>
        <a th:href="@{/register}" class="text-decoration-none fw-bold ms-1">Đăng ký ngay</a>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Hệ thống Quản lý Bán hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow p-4" style="width: 380px; border-radius: 12px;">
    <h3 class="text-center mb-4 text-success font-weight-bold">ĐĂNG KÝ</h3>

    <div th:if="${error}" class="alert alert-danger py-2" role="alert" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label font-weight-bold">Tài khoản mới</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Nhập tài khoản" required autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label font-weight-bold">Mật khẩu</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2 mt-2" style="border-radius: 8px;">Tạo Tài Khoản</button>
    </form>

    <div class="text-center mt-3">
        <a th:href="@{/login}" class="text-decoration-none">Đã có tài khoản? Đăng nhập ngay</a>
    </div>
</div>

</body>
</html>
